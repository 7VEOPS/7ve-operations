<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>7VE Staffing HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0A0A0A;--panel:#141414;--panel2:#1C1C1C;--line:#2A2A2A;--text:#F5F5F5;--muted:#9A9A9A;--red:#E70B0E;--red2:#FF3B3E;--green:#22C55E;--amber:#F5A623;--blue:#3B82F6;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red2)}
.hidden{display:none!important}
.brand{font-family:'Saira Condensed',sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.brand b{color:var(--red)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;padding:28px}
.lcard h1{margin:0 0 4px;font-size:28px}
.lcard p{color:var(--muted);margin:0 0 20px;font-size:13px}
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 5px}
input.i,select.i,textarea.i{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--red)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#444}
.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.p:hover{background:var(--red2)}
.btn.s{padding:4px 8px;font-size:12px}
.btn.g{background:transparent}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.bad{border-color:#5a1f1f;color:#f87171}
.lmsg{font-size:13px;margin-top:12px;min-height:18px}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.links a{cursor:pointer;color:var(--muted)}
/* shell */
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.hrow .brand{font-size:22px}
.sp{flex:1}
.who{color:var(--muted);font-size:12px}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--red)}
nav .badge{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
main{padding:18px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .n{font-family:'Saira Condensed';font-size:30px;font-weight:700;line-height:1}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.card>.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.ch h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.card>.cb{padding:12px 14px}
.cb.np{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1f1f1f;vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tw{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.c-g{color:var(--green);border-color:#14532d}
.c-r{color:#f87171;border-color:#5a1f1f}
.c-a{color:var(--amber);border-color:#5a4210}
.c-b{color:#93c5fd;border-color:#1e3a8a}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#444;vertical-align:middle}
.led.g{background:var(--green);box-shadow:0 0 6px var(--green)}
.led.r{background:var(--red);box-shadow:0 0 6px var(--red)}
.led.a{background:var(--amber)}
.empty{color:var(--muted);padding:16px;text-align:center;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .i{width:auto}
/* booking */
.bk{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:900px){.bk{grid-template-columns:1fr}}
.slist .it{padding:10px 12px;border-bottom:1px solid #1f1f1f;cursor:pointer}
.slist .it:hover{background:var(--panel2)}
.slist .it.on{border-left:3px solid var(--red);background:var(--panel2)}
.day{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--bg)}
.day .dh{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slot{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:6px;padding:6px 10px;align-items:center}
@media(max-width:700px){.slot{grid-template-columns:1fr 1fr}}
.slot .warn{grid-column:1/-1;font-size:11px;color:var(--amber);margin-top:-2px}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;justify-content:flex-end}
.dr{width:100%;max-width:460px;height:100%;overflow:auto;background:var(--panel);border-left:3px solid var(--red);padding:20px}
.md{margin:auto;width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;padding:20px;max-height:92vh;overflow:auto}
.dr h3,.md h3{margin:0 0 10px;font-family:'Saira Condensed';font-size:22px;text-transform:uppercase}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--red);padding:10px 14px;border-radius:6px;z-index:99;font-size:13px;max-width:90vw}
.flag{font-size:11px;color:var(--amber)}
.sub{background:#101010}
.sub td{font-size:12px;color:#cfcfcf}
.loading{color:var(--muted);padding:40px;text-align:center}
.help{color:var(--muted);font-size:12px;line-height:1.5}
.mapwrap{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.mapwrap{grid-template-columns:1fr}}
#map{height:calc(100vh - 230px);min-height:460px;border-radius:8px;border:1px solid var(--line);background:#111}
.mside{max-height:calc(100vh - 230px);overflow:auto}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1C1C1C;color:#F5F5F5}
.leaflet-container a.leaflet-popup-close-button{color:#aaa}
.mrow{padding:8px 12px;border-bottom:1px solid #1f1f1f;cursor:pointer;font-size:13px}
.mrow:hover{background:var(--panel2)}
.mrow.on{border-left:3px solid var(--red);background:var(--panel2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
@media print{header,nav,.toolbar,.btn,.noprint{display:none!important}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}td,th{color:#000;border-color:#ddd}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <div class="lcard">
    <h1 class="brand">7VE <b>Staffing</b> HQ</h1>
    <p>Book crew, track time and mileage, and get payroll ready.</p>
    <form id="lform" onsubmit="return doLogin(event)">
      <label class="f">Email</label>
      <input class="i" id="lemail" type="email" autocomplete="username" required>
      <label class="f">Password</label>
      <input class="i" id="lpass" type="password" autocomplete="current-password" required minlength="8">
      <div style="margin-top:16px"><button class="btn p" style="width:100%" id="lbtn">Sign in</button></div>
    </form>
    <div class="lmsg" id="lmsg"></div>
    <div class="links"><a onclick="doSignup()">First time? Create password</a><a onclick="doReset()">Forgot password</a></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div class="brand">7VE <b>Staffing</b> HQ</div>
      <div class="sp"></div>
      <span class="who" id="who"></span>
      <button class="btn s" onclick="MAPD=null;loadData()">↻ Refresh</button>
      <button class="btn s g" id="soBtn" onclick="signOut()">Sign out</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"><div class="loading">Loading…</div></main>
</div>

<div id="toast" class="hidden"></div>
<div id="layer"></div>

<script>
/* ================= CONFIG ================= */
const SUPA_URL='https://pjgthflwhcciiqgbzmrs.supabase.co';
const OPEN_MODE=true;
const SUPA_KEY='sb_publishable_M29g62qrLYCwNfs-0tJe5A_8f8KPrDO';
const POSITIONS=['A1','A2','V1','V2','L1','L2','GAV','Setup/AV Test','Stream Tech','PTZ Cam Tech','In-room Video/Hybrid','Audio Tech','Crew Chief','Technical Lead','Stagehand','Technical Director','Production Manager'];

/* storage that never throws (artifact / private mode safe) */
const memStore={};
const safeStore={
  getItem(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]??null}},
  setItem(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}},
  removeItem(k){try{localStorage.removeItem(k)}catch(e){delete memStore[k]}}
};
let sb=null;
try{ sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storage:safeStore,persistSession:true,autoRefreshToken:true}}); }catch(e){ console.error(e); }

/* ================= STATE ================= */
let D=null, TAB='status', ME=null;
const UI={bkSel:null,bkDraft:null,crewQ:'',clkTech:'',payStart:null,payEnd:null,payIncludeBooked:false,payOpen:{},milFilter:'all'};
let IDX={};

/* ================= UTIL ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rateFmt(n){return '$'+(+n||0).toFixed(3).replace(/0$/,'')}
function money(n){return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n,d=2){return (Number(n)||0).toFixed(d)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),3800)}
function ymd(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseYmd(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function todayYmd(){return ymd(new Date())}
function fmtDate(s){if(!s)return '';const d=typeof s==='string'&&s.length===10?parseYmd(s):new Date(s);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(s){if(!s)return '';return new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function fmtDT(s){if(!s)return '';return new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function hrsBetween(a,b){return Math.max(0,(new Date(b)-new Date(a))/36e5)}
function dur(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'h '+String(mm).padStart(2,'0')+'m'}
function toLocalInput(s){if(!s)return '';const d=new Date(s);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadCSV(name,rows){const txt=rows.map(r=>r.map(csvCell).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function mapLink(lat,lng){return lat!=null&&lng!=null?`<a href="https://maps.google.com/?q=${lat},${lng}" target="_blank" rel="noopener">📍 map</a>`:'<span class="muted small">no GPS</span>'}

/* ================= PAY RULES (match Ops Platform V4 card) ================= */
const V4={base:10,mini:5,otTo:12,otX:1.5,dtX:2,tiers:{
  gen:{label:'General Stagehand',pay:33},skl:{label:'Skilled Stagehand / AV Tech',pay:40},a2:{label:'A2 / L2 / V2',pay:48},
  a1:{label:'A1 / L1 / V1 / Crew Chief / Lead',pay:60},spc:{label:'Specialist / Designer / PM',pay:70},td:{label:'Technical Director',pay:80}}};
function v4Tier(txt){const t=String(txt||'').toLowerCase();
  if(/technical director|\btd\b/.test(t))return 'td';
  if(/production manager|designer|specialist|\bpm\b|\bld\b/.test(t))return 'spc';
  if(/a1|v1|l1|crew chief|technical lead|lead/.test(t))return 'a1';
  if(/a2|v2|l2|in-room|audio tech|hybrid/.test(t))return 'a2';
  if(/skilled|av tech|stream|ptz|camera|video|audio|lighting|gav/.test(t))return 'skl';
  return 'gen';}
function v4Split(h){
  if(h<=0)return {reg:0,ot:0,dt:0,units:0,mini:false,paid:0};
  if(h<=V4.mini)return {reg:V4.mini,ot:0,dt:0,units:V4.mini,mini:true,paid:V4.mini};
  const paid=Math.max(h,V4.base),reg=V4.base,ot=Math.min(Math.max(paid-V4.base,0),V4.otTo-V4.base),dt=Math.max(paid-V4.otTo,0);
  return {reg,ot,dt,units:reg+ot*V4.otX+dt*V4.dtX,mini:false,paid};}
function straightSplit(h){return {reg:h,ot:0,dt:0,units:h,mini:false,paid:h}}
/* schedule time strings like "6:00a-2:00p" (same reader as Ops Platform) */
function clockCand(t){t=String(t).trim().toLowerCase();
  if(/^(12(:00)?\s*)?midnight$/.test(t))return {c:[0],assumed:false};
  if(/^(12(:00)?\s*)?noon$/.test(t))return {c:[720],assumed:false};
  const m=t.match(/^(\d{1,2})(?::(\d{2}))?\s*(?:([ap])(?:\.?m\.?)?)?$/);if(!m)return null;
  const h=parseInt(m[1],10),mn=parseInt(m[2]||'0',10);if(h<1||h>12||mn>59)return null;
  const conv=ap=>{let hr=h;if(ap==='p'&&hr!==12)hr+=12;if(ap==='a'&&hr===12)hr=0;return hr*60+mn};
  if(m[3])return {c:[conv(m[3])],assumed:false};return {c:[conv('a'),conv('p')],assumed:true};}
function shiftRead(s){if(!s)return null;s=String(s).replace(/[–—]/g,'-');
  const R=/(\d{1,2}(?::\d{2})?\s*[ap](?:\.?m\.?)?|(?:12(?::00)?\s*)?(?:midnight|noon))\s*(?:-|\bto\b)\s*((?:12(?::00)?\s*)?(?:midnight|noon)|\d{1,2}(?::\d{2})?\s*(?:[ap](?:\.?m\.?)?)?)/i;
  const m=s.match(R);if(!m)return null;const A=clockCand(m[1]),B=clockCand(m[2]);if(!A||!B||A.assumed)return null;
  const a=A.c[0];const opts=B.c.map(b=>{let d=b-a;if(d<0)d+=1440;return d}).filter(d=>d>0);
  return {start:a,hours:(opts.length?Math.min(...opts):0)/60};}
function schedHours(t){const r=shiftRead(t);return r?r.hours:8}

/* ================= INDEXES ================= */
function staffName(s){return s?((s.first_name||'')+' '+(s.last_name||'')).trim():'—'}
function buildIndex(){
  const I={staff:{},staffByEmail:{},roster:{},rosterByEmail:{},addrByAuth:{},authByStaff:{},staffByAuth:{}};
  (D.staff||[]).forEach(s=>{I.staff[s.id]=s;if(s.email)I.staffByEmail[s.email.toLowerCase()]=s});
  (D.roster||[]).forEach(r=>{if(r.auth_user_id)I.roster[r.auth_user_id]=r;if(r.email)I.rosterByEmail[r.email.toLowerCase()]=r});
  (D.profiles||[]).forEach(p=>{if(p.address)I.addrByAuth[p.tech_user_id]=p.address});
  (D.staff||[]).forEach(s=>{const r=s.email&&I.rosterByEmail[s.email.toLowerCase()];if(r&&r.auth_user_id){I.authByStaff[s.id]=r.auth_user_id;I.staffByAuth[r.auth_user_id]=s}});
  // expand schedules into shifts
  I.shifts=[];
  (D.schedules||[]).forEach(sc=>{const d=sc.data||{};const created=new Date(sc.created_at);
    (d.days||[]).forEach(day=>{const date=day.date||labelDate(day.label,created);
      ((d.assign||{})[day.id]||[]).forEach((a,ix)=>{I.shifts.push({sid:sc.id,event:sc.event_name,client:d.client||'',venue:d.venue||'',dayId:day.id,label:day.label,date,ix,pos:a.pos||'',room:a.room||'',time:a.time||'',staffId:a.tech||null,hours:schedHours(a.time)})})})});
  I.availByStaff={};
  (D.availability||[]).forEach(a=>{const s=I.staffByAuth[a.tech_user_id];if(!s)return;(I.availByStaff[s.id]=I.availByStaff[s.id]||[]).push(a)});
  IDX=I;}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function labelDate(label,created){const L=String(label||'');let m=L.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m){const n=L.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/i);if(!n)return null;m=[null,MON[n[1].toLowerCase()],n[2],n[3]]}
  let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):created.getFullYear();const mo=+m[1],dd=+m[2];
  if(!m[3]&&mo<created.getMonth()+1-6)y++;return ymd(new Date(y,mo-1,dd));}
function techName(authId){const s=IDX.staffByAuth[authId];if(s)return staffName(s);const r=IDX.roster[authId];return r?r.full_name:'Unknown tech'}
function staffForAuth(authId){return IDX.staffByAuth[authId]||null}
function homeAddr(staff,authId){return (staff&&staff.address)||(authId&&IDX.addrByAuth[authId])||''}
function isUnavailable(staffId,date){return (IDX.availByStaff[staffId]||[]).some(a=>date&&a.date_start<=date&&a.date_end>=date)}
function shiftsOn(staffId,date){return IDX.shifts.filter(s=>s.staffId===staffId&&s.date===date)}
function settings(k){const S=(D&&D.settings)||{};const def={mileage:{rates:[{from:'2026-01-01',rate:0.725},{from:'2026-07-01',rate:0.76}],roundTrip:true,freeMiles:0,reimburse:true},payroll:{period:'weekly',weekStart:1,rateCard:'v4',payoutDays:30}};return Object.assign({},def[k],S[k]||{})}
function mileRate(date){const r=[...settings('mileage').rates].sort((a,b)=>a.from<b.from?-1:1);let v=r.length?r[0].rate:0.76;r.forEach(x=>{if(date>=x.from)v=x.rate});return +v}

/* ================= AUTH ================= */
async function boot(){
  if(!sb){document.body.innerHTML='<div class="loading">Could not load the Supabase library. Check your connection and reload.</div>';return}
  // LOGIN TURNED OFF for now (OPEN_MODE). To bring it back: set OPEN_MODE=false here
  // and set staffing_settings 'access' to {"open":false} in the database.
  if(OPEN_MODE){startApp();return}
  const {data:{session}}=await sb.auth.getSession();
  if(session)startApp();else showLogin();
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')showLogin();if(ev==='PASSWORD_RECOVERY')promptNewPassword()});
}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function doLogin(e){e.preventDefault();const m=$('lmsg');m.textContent='Signing in…';m.style.color='var(--muted)';
  const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});
  if(error){m.textContent=error.message;m.style.color='#f87171';return false}
  m.textContent='';startApp();return false}
async function doSignup(){const email=$('lemail').value.trim(),pw=$('lpass').value,m=$('lmsg');
  if(!email||pw.length<8){m.style.color='var(--amber)';m.textContent='Type your email and a new password (8+ characters) above, then click Create password again.';return}
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}});
  if(error){m.style.color='#f87171';m.textContent=error.message;return}
  if(data.session){startApp()}else{m.style.color='var(--green)';m.textContent='Check your email to confirm, then sign in here.'}}
async function doReset(){const email=$('lemail').value.trim(),m=$('lmsg');
  if(!email){m.style.color='var(--amber)';m.textContent='Type your email above first.';return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
  m.style.color=error?'#f87171':'var(--green)';m.textContent=error?error.message:'Reset link sent. Check your email.'}
async function promptNewPassword(){openModal(`<h3>Set a new password</h3><label class="f">New password (8+ characters)</label><input class="i" id="npw" type="password" minlength="8"><div class="acts"><button class="btn p" onclick="saveNewPw()">Save</button></div>`)}
async function saveNewPw(){const pw=$('npw').value;if(pw.length<8)return toast('Use 8 or more characters');const {error}=await sb.auth.updateUser({password:pw});if(error)return toast(error.message);closeLayer();toast('Password updated');startApp()}
async function signOut(){await sb.auth.signOut();showLogin()}

/* ================= DATA ================= */
function loadRange(){const t=new Date();let from=addDays(t,-45);if(UI.payStart&&parseYmd(UI.payStart)<from)from=addDays(parseYmd(UI.payStart),-1);return {from:ymd(from),to:ymd(addDays(t,1))}}
async function startApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadData();
  clearInterval(startApp._t);startApp._t=setInterval(()=>{if(TAB==='status'&&!document.hidden&&!$('layer').innerHTML)loadData(true)},60000)}
async function loadData(quiet){
  if(!quiet)$('main').innerHTML='<div class="loading">Loading…</div>';
  const r=loadRange();
  const {data,error}=await sb.rpc('sh_overview',{p_from:r.from,p_to:r.to});
  if(error){
    const msg=/not authorized/i.test(error.message)?'This account does not have Staffing HQ access yet. Ask the 7VE owner to add your email in Settings → Access.':
      /function .*sh_overview|could not find/i.test(error.message)?'Staffing HQ is not set up in the database yet (staffing_hq_v1 has not been applied).':error.message;
    $('main').innerHTML=`<div class="card"><div class="cb"><b>Can't load Staffing HQ.</b><p class="muted">${esc(msg)}</p>${OPEN_MODE?'<button class="btn" onclick="loadData()">Try again</button>':'<button class="btn" onclick="signOut()">Sign out</button>'}</div></div>`;
    $('nav').innerHTML='';return}
  D=data;D._from=r.from;ME=D.me;buildIndex();$('who').textContent=OPEN_MODE?'Open access — no login':ME.email+(ME.is_admin?' · owner':'');if(OPEN_MODE)$('soBtn').classList.add('hidden');render()}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error){toast(error.message);throw error}return data}

/* ================= SHELL ================= */
const TABS=[['status','Team Status'],['booking','Booking'],['map','Map'],['crew','Crew'],['clock','Time Clock'],['mileage','Mileage'],['payroll','Payroll Prep'],['settings','Settings']];
function render(){
  const pend=(D.requests||[]).filter(r=>r.status==='pending').length;
  const milPend=(D.mileage||[]).filter(m=>m.status==='pending').length;
  $('nav').innerHTML=TABS.map(([k,l])=>{let b='';if(k==='clock'&&pend)b=`<span class="badge">${pend}</span>`;if(k==='mileage'&&milPend)b=`<span class="badge">${milPend}</span>`;return `<button class="${TAB===k?'on':''}" onclick="go('${k}')">${l}${b}</button>`}).join('');
  const fn={status:rStatus,booking:rBooking,map:rMap,crew:rCrew,clock:rClock,mileage:rMileage,payroll:rPayroll,settings:rSettings}[TAB];
  $('main').innerHTML=fn();
  if(TAB==='booking')bkAfterRender();
  if(TAB==='map')mapAfterRender();
}
function go(t){TAB=t;render();window.scrollTo(0,0)}
function openDrawer(html){$('layer').innerHTML=`<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="dr">${html}</div></div>`}
function openModal(html){$('layer').innerHTML=`<div class="ov" style="justify-content:center;padding:16px" onclick="if(event.target===this)closeLayer()"><div class="md">${html}</div></div>`}
function closeLayer(){$('layer').innerHTML=''}

/* ================= TEAM STATUS ================= */
function rStatus(){
  const now=new Date(),today=todayYmd();
  const open=(D.clock||[]).filter(c=>!c.clock_out_at);
  const todayShifts=IDX.shifts.filter(s=>s.date===today&&s.staffId);
  const clockedToday=new Set((D.clock||[]).filter(c=>ymd(c.clock_in_at)===today).map(c=>{const s=staffForAuth(c.tech_user_id);return s&&s.id}));
  const notIn=todayShifts.filter(s=>!clockedToday.has(s.staffId));
  const online=(D.roster||[]).filter(r=>r.last_active_at&&(now-new Date(r.last_active_at))<10*60e3&&!r.is_admin);
  const pend=(D.requests||[]).filter(r=>r.status==='pending');
  const notAct=(D.staff||[]).filter(s=>!isPlaceholder(s)).filter(s=>{const r=s.email&&IDX.rosterByEmail[s.email.toLowerCase()];return !r||!r.auth_user_id});
  const upcoming=IDX.shifts.filter(s=>s.date&&s.date>today&&s.date<=ymd(addDays(now,7))&&s.staffId);
  const openSlots=IDX.shifts.filter(s=>s.date&&s.date>=today&&!s.staffId).length;
  let h=`<div class="kpis">
    <div class="kpi"><div class="n" style="color:var(--green)">${open.length}</div><div class="l">On the clock now</div></div>
    <div class="kpi"><div class="n">${todayShifts.length}</div><div class="l">Booked today</div></div>
    <div class="kpi"><div class="n" style="color:${notIn.length?'var(--amber)':'inherit'}">${notIn.length}</div><div class="l">Booked, not clocked in</div></div>
    <div class="kpi"><div class="n">${online.length}</div><div class="l">In the portal now</div></div>
    <div class="kpi"><div class="n" style="color:${pend.length?'var(--red2)':'inherit'}">${pend.length}</div><div class="l">Clock fixes to review</div></div>
    <div class="kpi"><div class="n" style="color:${openSlots?'var(--amber)':'inherit'}">${openSlots}</div><div class="l">Unfilled slots ahead</div></div>
  </div><div class="grid2"><div>`;
  h+=`<div class="card"><div class="ch"><h2><span class="led g"></span>On the clock</h2></div><div class="cb np tw">`+(open.length?`<table><tr><th>Tech</th><th>Since</th><th class="num">Time</th><th>Location</th><th></th></tr>`+open.map(c=>`<tr><td><b>${esc(techName(c.tech_user_id))}</b></td><td>${fmtDT(c.clock_in_at)}</td><td class="num">${dur(hrsBetween(c.clock_in_at,now))}</td><td>${mapLink(c.in_lat,c.in_lng)}</td><td><button class="btn s" onclick="clockOutNow('${c.id}')">Clock out</button></td></tr>`).join('')+`</table>`:`<div class="empty">Nobody is clocked in right now.</div>`)+`</div></div>`;
  h+=`<div class="card"><div class="ch"><h2>Today's crew · ${fmtDate(today)}</h2></div><div class="cb np tw">`+(todayShifts.length?`<table><tr><th>Tech</th><th>Event</th><th>Role</th><th>Call</th><th>Status</th></tr>`+todayShifts.map(s=>{
      const st=IDX.staff[s.staffId];const auth=IDX.authByStaff[s.staffId];
      const c=(D.clock||[]).find(c=>c.tech_user_id===auth&&ymd(c.clock_in_at)===today);
      const sr=shiftRead(s.time);let chip;
      if(c&&!c.clock_out_at)chip='<span class="chip c-g">Clocked in '+fmtTime(c.clock_in_at)+'</span>';
      else if(c)chip='<span class="chip c-b">Done '+fmtTime(c.clock_out_at)+'</span>';
      else if(sr&&(now.getHours()*60+now.getMinutes())>sr.start+10)chip='<span class="chip c-r">Late / no clock-in</span>';
      else chip='<span class="chip">Not in yet</span>';
      if(!auth)chip+=' <span class="chip c-a">No portal login</span>';
      return `<tr><td><b>${esc(staffName(st))}</b><div class="small muted">${esc(st&&st.phone||'')}</div></td><td>${esc(s.event)}<div class="small muted">${esc(s.room)}</div></td><td>${esc(s.pos)}</td><td class="mono small">${esc(s.time)}</td><td>${chip}</td></tr>`}).join('')+`</table>`:`<div class="empty">No one is booked today.</div>`)+`</div></div>`;
  h+=`</div><div>`;
  h+=`<div class="card"><div class="ch"><h2>Clock fixes waiting</h2></div><div class="cb np tw">`+(pend.length?reqTable(pend):`<div class="empty">No requests waiting.</div>`)+`</div></div>`;
  h+=`<div class="card"><div class="ch"><h2>Next 7 days</h2><span class="sp"></span><button class="btn s" onclick="go('booking')">Open booking</button></div><div class="cb np tw">`+(upcoming.length?`<table><tr><th>Date</th><th>Tech</th><th>Event</th><th>Call</th></tr>`+upcoming.sort((a,b)=>a.date<b.date?-1:1).slice(0,40).map(s=>`<tr><td class="small">${fmtDate(s.date)}</td><td>${esc(staffName(IDX.staff[s.staffId]))}</td><td class="small">${esc(s.event)} · ${esc(s.pos)}</td><td class="mono small">${esc(s.time)}</td></tr>`).join('')+`</table>`:`<div class="empty">Nothing booked in the next week.</div>`)+`</div></div>`;
  h+=`<div class="card"><div class="ch"><h2>In the portal now</h2></div><div class="cb">`+(online.length?online.map(r=>`<span class="chip c-g"><span class="led g"></span>${esc(r.full_name)}</span>`).join(''):`<span class="muted small">No techs active in the last 10 minutes.</span>`)+`</div></div>`;
  if(notAct.length)h+=`<div class="card"><div class="ch"><h2>Staff without an active portal login</h2></div><div class="cb small">${notAct.map(s=>`<span class="chip c-a">${esc(staffName(s))}</span>`).join('')}<p class="help">These people can't clock in from the Tech Portal until they activate their account at tech.7virtuesentertainment.com. Clock them in by hand in Time Clock if needed.</p></div></div>`;
  h+=`</div></div><p class="help">Updates every minute while this tab is open.</p>`;
  return h;}
function reqTable(list){return `<table><tr><th>Tech</th><th>Asked for</th><th>Was</th><th>Reason</th><th></th></tr>`+list.map(r=>`<tr><td><b>${esc(r.full_name||techName(r.tech_user_id))}</b><div class="small muted">${fmtDT(r.created_at)}</div></td><td class="small">${fmtDT(r.requested_in)} → ${r.requested_out?fmtTime(r.requested_out):'—'}</td><td class="small muted">${r.cur_in?fmtDT(r.cur_in)+' → '+(r.cur_out?fmtTime(r.cur_out):'open'):'new shift'}</td><td class="small">${esc(r.reason||'')}</td><td>${r.status==='pending'?`<div class="row"><button class="btn s ok" onclick="resolveReq('${r.id}',true)">Approve</button><button class="btn s bad" onclick="resolveReq('${r.id}',false)">Deny</button></div>`:`<span class="chip">${esc(r.status)}</span>`}</td></tr>`).join('')+`</table>`}
async function resolveReq(id,ok){await rpc('sh_request_resolve',{p_id:id,p_approve:ok});toast(ok?'Approved — time updated':'Denied');loadData(true)}
async function clockOutNow(id){if(!confirm('Clock this tech out now?'))return;await rpc('sh_clock_out_now',{p_id:id});toast('Clocked out');loadData(true)}

/* ================= BOOKING ================= */
function schedDates(sc){const d=sc.data||{};const c=new Date(sc.created_at);return (d.days||[]).map(x=>x.date||labelDate(x.label,c)).filter(Boolean).sort()}
function rBooking(){
  const today=todayYmd();
  const list=(D.schedules||[]).map(sc=>{const ds=schedDates(sc);return {sc,first:ds[0]||'',last:ds[ds.length-1]||''}});
  const up=list.filter(x=>!x.last||x.last>=today).sort((a,b)=>(a.first||'9')<(b.first||'9')?-1:1);
  const past=list.filter(x=>x.last&&x.last<today).sort((a,b)=>a.last>b.last?-1:1);
  const item=x=>{const sc=x.sc,d=sc.data||{};let need=0,fill=0;(d.days||[]).forEach(day=>{need+=+day.needed||0;fill+=((d.assign||{})[day.id]||[]).filter(a=>a.tech).length});
    return `<div class="it ${UI.bkSel===sc.id?'on':''}" onclick="bkOpen('${sc.id}')"><b>${esc(sc.event_name||'Untitled')}</b><div class="small muted">${x.first?fmtDate(x.first):'no dates'}${x.last&&x.last!==x.first?' – '+fmtDate(x.last):''} · <span style="color:${fill<need?'var(--amber)':'var(--green)'}">${fill}/${need} filled</span></div></div>`};
  let h=`<div class="bk"><div><div class="card"><div class="ch"><h2>Bookings</h2><span class="sp"></span><button class="btn s p" onclick="bkNew()">+ New</button></div><div class="cb np slist">`+
    (up.length?up.map(item).join(''):'<div class="empty">No upcoming bookings.</div>')+
    (past.length?`<div class="small muted" style="padding:10px 12px;border-top:1px solid var(--line)">PAST</div>`+past.slice(0,25).map(item).join(''):'')+
    `</div></div></div><div id="bkEd">${UI.bkDraft?'':'<div class="card"><div class="cb empty">Pick a booking on the left, or click + New.</div></div>'}</div></div>`;
  return h;}
function bkOpen(id){const sc=D.schedules.find(s=>s.id===id);UI.bkSel=id;UI.bkDraft={id,event_name:sc.event_name,data:JSON.parse(JSON.stringify(sc.data||{}))};
  const c=new Date(sc.created_at);(UI.bkDraft.data.days||[]).forEach(d=>{if(!d.date)d.date=labelDate(d.label,c)||''});render()}
function bkNew(){UI.bkSel=null;const id='d'+Date.now();
  UI.bkDraft={id:null,event_name:'',data:{days:[{id,label:'',date:todayYmd(),needed:1}],assign:{[id]:[]},off:{},skills:{},taxOn:true,budget:'',client:'',venue:'',netTerms:'30',rateCard:'v4',rateSetup:60,rateSkilled:70}};render()}
function bkAfterRender(){if(UI.bkDraft)$('bkEd').innerHTML=bkEditor()}
function staffOptions(sel,date,dayId){
  const B=UI.bkDraft;
  const opts=(D.staff||[]).map(s=>{let tag='';
    if(isUnavailable(s.id,date))tag=' ⛔ unavailable';
    else{const other=shiftsOn(s.id,date).filter(x=>x.sid!==B.id);const same=((B.data.assign||{})[dayId]||[]).filter(a=>a.tech===s.id).length;
      if(other.length)tag=' ⚠ booked: '+other[0].event; else if(same>1)tag=' ⚠ twice this day';}
    return `<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(staffName(s))}${s.lead_skill?' · '+esc(s.lead_skill):''}${esc(tag)}</option>`}).join('');
  return `<option value="">— open slot —</option>`+opts}
function bkEditor(){
  const B=UI.bkDraft,d=B.data;d.assign=d.assign||{};
  const clients=[...new Set((D.jobs||[]).map(j=>j.client).concat((D.schedules||[]).map(s=>(s.data||{}).client)).filter(Boolean))];
  let h=`<div class="card"><div class="ch"><h2>${B.id?'Edit booking':'New booking'}</h2><span class="sp"></span>
    <button class="btn s" onclick="bkCrewText()">Copy crew text</button><button class="btn s" onclick="bkEmail()">Email crew</button><button class="btn s p" onclick="bkSave()">Save</button></div><div class="cb">
    <div class="f2"><div><label class="f">Event / show name</label><input class="i" value="${esc(B.event_name)}" oninput="UI.bkDraft.event_name=this.value"></div>
    <div><label class="f">Client</label><input class="i" list="clist" value="${esc(d.client||'')}" oninput="UI.bkDraft.data.client=this.value"><datalist id="clist">${clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>
    <label class="f">Venue / address (used for crew text and mileage labels)</label><input class="i" value="${esc(d.venue||'')}" oninput="UI.bkDraft.data.venue=this.value">
    <datalist id="plist">${POSITIONS.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div style="margin-top:14px">`;
  (d.days||[]).forEach((day,di)=>{const slots=d.assign[day.id]=d.assign[day.id]||[];const filled=slots.filter(a=>a.tech).length;
    h+=`<div class="day"><div class="dh"><input class="i" type="date" style="width:150px" value="${esc(day.date||'')}" onchange="bkDay(${di},'date',this.value)">
      <input class="i" style="width:170px" placeholder="Label e.g. 11/4 Morning" value="${esc(day.label||'')}" oninput="bkDay(${di},'label',this.value,true)">
      <span class="small muted">Needed</span><input class="i" type="number" min="0" style="width:64px" value="${+day.needed||0}" onchange="bkDay(${di},'needed',+this.value)">
      <span class="chip ${filled<(+day.needed||0)?'c-a':'c-g'}">${filled}/${+day.needed||0}</span><span class="sp"></span>
      <button class="btn s" onclick="bkSlotAdd(${di})">+ Slot</button><button class="btn s g" onclick="bkDayCopy(${di})">Duplicate day</button><button class="btn s bad" onclick="bkDayDel(${di})">✕</button></div>`;
    slots.forEach((a,si)=>{let warn='';if(a.tech){if(isUnavailable(a.tech,day.date))warn='Marked unavailable this day in the Tech Portal.';else{const o=shiftsOn(a.tech,day.date).filter(x=>x.sid!==B.id);if(o.length)warn='Also booked on '+o.map(x=>x.event+' ('+x.time+')').join(', ')}
      const st=IDX.staff[a.tech];if(st&&!IDX.authByStaff[a.tech])warn+=(warn?' · ':'')+'No portal login — they can\'t clock in themselves.'}
      h+=`<div class="slot"><select class="i" onchange="bkSlot(${di},${si},'tech',this.value)">${staffOptions(a.tech,day.date,day.id)}</select>
        <input class="i" list="plist" placeholder="Role" value="${esc(a.pos||'')}" oninput="bkSlot(${di},${si},'pos',this.value,true)">
        <input class="i" placeholder="Room" value="${esc(a.room||'')}" oninput="bkSlot(${di},${si},'room',this.value,true)">
        <input class="i mono" placeholder="6:00a-2:00p" value="${esc(a.time||'')}" oninput="bkSlot(${di},${si},'time',this.value,true)">
        <button class="btn s g" onclick="bkSlotDel(${di},${si})">✕</button>${warn?`<div class="warn">⚠ ${esc(warn)}</div>`:''}</div>`});
    if(!slots.length)h+=`<div class="empty small">No slots yet.</div>`;
    h+=`</div>`});
  h+=`<button class="btn" onclick="bkDayAdd()">+ Add day</button></div>
    <p class="help">Saved bookings show up in the Ops Platform's Crew Schedule and on each tech's portal schedule. ⛔ = tech marked unavailable · ⚠ = already booked elsewhere that day.</p></div></div>`;
  return h;}
function bkRe(){$('bkEd').innerHTML=bkEditor()}
function bkDay(i,k,v,quiet){const day=UI.bkDraft.data.days[i];day[k]=v;if(k==='date'&&v&&!day.label){const d=parseYmd(v);day.label=(d.getMonth()+1)+'/'+d.getDate()}if(!quiet)bkRe()}
function bkDayAdd(){const d=UI.bkDraft.data;const last=d.days[d.days.length-1];const id='d'+Date.now();const date=last&&last.date?ymd(addDays(parseYmd(last.date),1)):todayYmd();const dt=parseYmd(date);
  d.days.push({id,label:(dt.getMonth()+1)+'/'+dt.getDate(),date,needed:last?last.needed:1});d.assign[id]=[];bkRe()}
function bkDayCopy(i){const d=UI.bkDraft.data,src=d.days[i];const id='d'+Date.now();const date=src.date?ymd(addDays(parseYmd(src.date),1)):'';const dt=date?parseYmd(date):null;
  d.days.splice(i+1,0,{id,label:dt?(dt.getMonth()+1)+'/'+dt.getDate():'',date,needed:src.needed});d.assign[id]=JSON.parse(JSON.stringify(d.assign[src.id]||[]));bkRe()}
function bkDayDel(i){if(!confirm('Remove this day and its slots?'))return;const d=UI.bkDraft.data;const day=d.days.splice(i,1)[0];delete d.assign[day.id];bkRe()}
function bkSlotAdd(i){const d=UI.bkDraft.data,day=d.days[i];const prev=(d.assign[day.id]||[]).slice(-1)[0];(d.assign[day.id]=d.assign[day.id]||[]).push({tech:'',pos:prev?prev.pos:'',room:prev?prev.room:'',time:prev?prev.time:''});bkRe()}
function bkSlotDel(i,s){const d=UI.bkDraft.data;d.assign[d.days[i].id].splice(s,1);bkRe()}
function bkSlot(i,s,k,v,quiet){const d=UI.bkDraft.data;d.assign[d.days[i].id][s][k]=v;if(!quiet)bkRe()}
async function bkSave(){const B=UI.bkDraft;if(!B.event_name.trim())return toast('Give the booking a name');
  B.data.days.forEach(day=>{if(!day.label&&day.date){const d=parseYmd(day.date);day.label=(d.getMonth()+1)+'/'+d.getDate()}});
  const id=await rpc('sh_schedule_save',{p_id:B.id,p_name:B.event_name.trim(),p_data:B.data});UI.bkSel=id;B.id=id;toast('Booking saved');await loadData(true);if(D.schedules.find(s=>s.id===id))bkOpen(id)}
function bkCrewLines(){const B=UI.bkDraft,d=B.data;let out=[B.event_name+(d.venue?' — '+d.venue:'')];
  (d.days||[]).forEach(day=>{out.push('');out.push((day.date?fmtDate(day.date):'')+(day.label?' ('+day.label+')':''));
    (d.assign[day.id]||[]).forEach(a=>out.push('• '+(a.tech?staffName(IDX.staff[a.tech]):'OPEN')+' — '+(a.pos||'')+(a.room?' · '+a.room:'')+(a.time?' · '+a.time:'')))});
  out.push('');out.push('Clock in and out in the 7VE Tech Portal: tech.7virtuesentertainment.com');return out.join('\n')}
async function bkCrewText(){const t=bkCrewLines();try{await navigator.clipboard.writeText(t);toast('Crew list copied')}catch(e){openModal(`<h3>Crew text</h3><textarea class="i" rows="14">${esc(t)}</textarea><div class="acts"><button class="btn" onclick="closeLayer()">Close</button></div>`)}}
function bkEmail(){const d=UI.bkDraft.data;const emails=[...new Set(Object.values(d.assign||{}).flat().map(a=>a.tech&&IDX.staff[a.tech]&&IDX.staff[a.tech].email).filter(Boolean))];
  if(!emails.length)return toast('No booked crew with email addresses yet');

/* ================= MILEAGE ================= */
function geoCache(){try{return JSON.parse(safeStore.getItem('sh_geo')||'{}')}catch(e){return {}}}
function cleanAddr(a){return String(a).replace(/\b(apt|apartment|unit|suite|ste)\.?\s*#?\s*[\w-]+,?/ig,'').replace(/#\s*[\w-]+,?/g,'').replace(/\bNortheast\b/i,'NE').replace(/\bNorthwest\b/i,'NW').replace(/\bSoutheast\b/i,'SE').replace(/\bSouthwest\b/i,'SW').replace(/\bHWY\b/i,'Highway').replace(/,\s*,/g,',').replace(/\s{2,}/g,' ').replace(/[.,\s]+$/,'').trim()}
async function geocode(addr){const c=geoCache();if(c[addr])return c[addr];
  const tries=[addr,cleanAddr(addr)].filter((v,i,a)=>v&&a.indexOf(v)===i);
  for(let i=0;i<tries.length;i++){if(i)await sleep(1100);
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(tries[i]),{headers:{'Accept':'application/json'}});
    const j=await r.json();if(j.length){const p={lat:+j[0].lat,lng:+j[0].lon};c[addr]=p;safeStore.setItem('sh_geo',JSON.stringify(c));return p}}
  return null}
function haversineMi(a,b){const R=3958.8,t=x=>x*Math.PI/180;const dLat=t(b.lat-a.lat),dLng=t(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function driveMiles(a,b){try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);const j=await r.json();
  if(j.routes&&j.routes[0])return {mi:j.routes[0].distance/1609.344,est:false}}catch(e){}return {mi:haversineMi(a,b)*1.25,est:true}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

   <div class="toolbar"><button class="btn p" onclick="milCalc()" ${todo.length?'':'disabled'}>Calculate from clock-ins (${todo.length})</button><button class="btn" onclick="milEdit()">+ Add trip by hand</button>
    <select class="i" onchange="UI.milFilter=this.value;render()">${['all','pending','approved','paid','rejected'].map(s=>`<option ${UI.milFilter===s?'selected':''}>${s}</option>`).join('')}</select>
    <button class="btn ok" onclick="milApproveAll()">Approve all pending</button><button class="btn" onclick="milExport()">Export IRS mileage log</button></div>

   <div id="milProg"></div>

    const stc={pending:'c-a',approved:'c-g',paid:'c-b',rejected:'c-r'}[m.status]||'';
    return `<tr><td class="small">${fmtDate(m.trip_date)}</td><td><b>${esc(nm)}</b></td><td class="small">${esc(m.from_addr||'')}<div class="muted">→ ${esc(m.to_label||'')}${m.to_lat!=null?' '+mapLink(m.to_lat,m.to_lng):''}</div></td>

     <td class="small muted">${esc(m.source)}${m.notes?'<div>'+esc(m.notes)+'</div>':''}</td><td><span class="chip ${stc}">${esc(m.status)}</span></td>

  h+=`</table>${rows.length?'':'<div class="empty">No mileage yet. Click "Calculate from clock-ins" or add a trip by hand.</div>'}</div></div>`;return h}
async function milCalc(){
  const S=settings('mileage');const have=new Set((D.mileage||[]).map(m=>m.clock_id).filter(Boolean));
  const todo=(D.clock||[]).filter(c=>c.in_lat!=null&&!have.has(c.id));const prog=$('milProg');let done=0,skipped=[];
  for(const c of todo){
    prog.innerHTML=`<div class="card"><div class="cb small">Calculating ${done+1} of ${todo.length}… (about 1 second each)</div></div>`;
    const st=staffForAuth(c.tech_user_id);const addr=homeAddr(st,c.tech_user_id);
    if(!addr){skipped.push(techName(c.tech_user_id)+' (no home address)');done++;continue}
    let home=null;try{home=await geocode(addr)}catch(e){}
    await sleep(1100);
    if(!home){skipped.push(techName(c.tech_user_id)+' (address not found)');done++;continue}
    const site={lat:c.in_lat,lng:c.in_lng};const dm=await driveMiles(home,site);
    const date=ymd(c.clock_in_at);const m=matchShift(c);
    let miles=(S.roundTrip?2:1)*dm.mi;miles=Math.max(0,miles-(+S.freeMiles||0));
    try{await rpc('sh_mileage_save',{p:{staff_id:st?st.id:null,tech_user_id:c.tech_user_id,clock_id:c.id,trip_date:date,purpose:m?('Crew call: '+m.event):'Crew call',
      from_addr:addr,to_label:(m&&(m.venue||m.event))||'Clock-in location',to_lat:c.in_lat,to_lng:c.in_lng,one_way_miles:+dm.mi.toFixed(1),round_trip:!!S.roundTrip,
      miles:+miles.toFixed(1),rate:mileRate(date),source:'auto',status:'pending',notes:dm.est?'Estimated (routing service unavailable) — check':null}})}catch(e){skipped.push(techName(c.tech_user_id)+' (save failed)')}
    done++}
  prog.innerHTML='';toast(`Mileage calculated for ${done-skipped.length} shift(s)`+(skipped.length?` · skipped: ${skipped.join(', ')}`:''));loadData(true)}
function milEdit(id){const m=id?(D.mileage||[]).find(x=>x.id===id):{trip_date:todayYmd(),round_trip:settings('mileage').roundTrip,status:'pending'};

/* ================= PAYROLL PREP ================= */
function defaultPeriod(){const P=settings('payroll');const t=new Date();const ws=+P.weekStart||1;
  let start=addDays(t,-((t.getDay()-ws+7)%7));start=addDays(start,P.period==='biweekly'?-14:-7);const len=P.period==='biweekly'?14:7;
  return {s:ymd(start),e:ymd(addDays(start,len-1))}}
function payShift(c,staff,P){
  const hrs=hrsBetween(c.clock_in_at,c.clock_out_at);const m=matchShift(c);
  const role=(m&&m.pos)||staff.lead_skill||staff.title||'';const tier=v4Tier(role);
  const pr=payRateFor(staff,role);const split=P.rateCard==='straight'?straightSplit(hrs):v4Split(hrs);
  return {kind:'clock',id:c.id,date:ymd(c.clock_in_at),in:c.clock_in_at,out:c.clock_out_at,hrs,event:m?m.event:'',pos:role,rate:pr.rate,split,pay:pr.rate*split.units,basis:pr.basis,manual:c.manual}}
/* same rule as the Ops Platform: use the staff hourly rate if set, otherwise the V4 tier pay for the role */
function payRateFor(staff,role){const tier=v4Tier(role||staff.lead_skill||staff.title);const T=V4.tiers[tier];const pr=+staff.pay_rate;
  if(pr>0&&(!staff.pay_type||staff.pay_type==='hourly'))return {rate:pr,basis:'staff hourly rate'};
  return {rate:T.pay,basis:'V4 '+T.label+(pr>0?' (pay type is "day")':' (no rate on file)')}}
function buildPayroll(s,e){
  const P=settings('payroll'),MS=settings('mileage');const lines={};const flags=[];
  const L=st=>lines[st.id]=lines[st.id]||{staff_id:st.id,name:staffName(st),shifts:[],booked:[],open:0,miles:0,mileAmt:0,milePending:0,mileIds:[],flags:[]};
  (D.clock||[]).forEach(c=>{const d=ymd(c.clock_in_at);if(d<s||d>e)return;const st=staffForAuth(c.tech_user_id);
    if(!st){flags.push(techName(c.tech_user_id)+' clocked in but is not an active staff member — check People in the Ops Platform');return}
    const l=L(st);if(!c.clock_out_at){l.open++;return}l.shifts.push(payShift(c,st,P))});
  // booked shifts with no clock-in
  IDX.shifts.forEach(x=>{if(!x.staffId||!x.date||x.date<s||x.date>e)return;const st=IDX.staff[x.staffId];if(!st)return;const auth=IDX.authByStaff[x.staffId];
    if(isPlaceholder(st))return;const hit=(D.clock||[]).some(c=>c.tech_user_id===auth&&ymd(c.clock_in_at)===x.date);if(hit)return;const l=L(st);
    const pr=payRateFor(st,x.pos);const split=P.rateCard==='straight'?straightSplit(x.hours):v4Split(x.hours);
    l.booked.push({kind:'booked',date:x.date,hrs:x.hours,event:x.event,pos:x.pos,time:x.time,rate:pr.rate,split,pay:pr.rate*split.units,basis:pr.basis+' · booked hours'})});
  (D.mileage||[]).forEach(m=>{if(m.trip_date<s||m.trip_date>e||!m.staff_id)return;const st=IDX.staff[m.staff_id];if(!st)return;const l=L(st);
    if(m.status==='approved'||m.status==='paid'){if(MS.reimburse){l.miles+=+m.miles;l.mileAmt+=+m.amount;l.mileIds.push(m.id)}}else if(m.status==='pending')l.milePending++});
  const out=Object.values(lines).map(l=>{const st=IDX.staff[l.staff_id];const use=l.shifts.concat(UI.payIncludeBooked?l.booked:[]);
    const sum=(k)=>use.reduce((a,x)=>a+(k==='pay'?x.pay:k==='hrs'?x.hrs:x.split[k]),0);
    l.hrs=sum('hrs');l.reg=sum('reg');l.ot=sum('ot');l.dt=sum('dt');l.labor=sum('pay');l.total=l.labor+l.mileAmt;
    const lastDay=use.map(x=>x.date).sort().pop();l.payBy=lastDay?ymd(addDays(parseYmd(lastDay),+P.payoutDays||30)):'';
    l.pay_method=st.pay_method||'';l.pay_handle=st.pay_handle||'';
    payReady(st).forEach(m=>l.flags.push('Missing '+m));if(l.open)l.flags.push(l.open+' shift(s) still open');
    if(l.booked.length&&!UI.payIncludeBooked)l.flags.push(l.booked.length+' booked shift(s) with no clock-in');if(l.milePending)l.flags.push(l.milePending+' mileage trip(s) not approved');
    if(use.some(x=>/^V4/.test(x.basis)))l.flags.push('Paid at V4 card rate (no hourly rate on file)');
    return l}).filter(l=>l.shifts.length||l.booked.length||l.miles||l.open).sort((a,b)=>a.name<b.name?-1:1);
  const T={people:out.length,hrs:out.reduce((a,l)=>a+l.hrs,0),labor:out.reduce((a,l)=>a+l.labor,0),miles:out.reduce((a,l)=>a+l.miles,0),mileage:out.reduce((a,l)=>a+l.mileAmt,0)};T.total=T.labor+T.mileage;
  return {lines:out,totals:T,flags}}

   ${run&&run.status!=='draft'?`<div class="card"><div class="cb small">This period was <b>${esc(run.status)}</b>${run.approved_by?' by '+esc(run.approved_by)+' on '+fmtDT(run.approved_at):''}. The snapshot saved then: ${money((run.totals||{}).total)} for ${(run.totals||{}).people||0} people. Numbers below are live; if they differ, something changed after approval.</div></div>`:''}
   <div class="card"><div class="ch"><h2>${fmtDate(UI.payStart)} – ${fmtDate(UI.payEnd)} · ${P.rateCard==='straight'?'straight hourly':'V4 rules: 5-hr minimum, 10-hr day, OT 1.5× hrs 11–12, DT 2× after 12'}</h2></div><div class="cb np tw">

  R.lines.forEach(l=>{const use=l.shifts.concat(UI.payIncludeBooked?l.booked:[]);const open=UI.payOpen[l.staff_id];
    h+=`<tr style="cursor:pointer" onclick="UI.payOpen['${l.staff_id}']=!UI.payOpen['${l.staff_id}'];render()"><td><b>${open?'▾':'▸'} ${esc(l.name)}</b></td><td class="num">${use.length}</td><td class="num">${num(l.hrs)}</td>
     <td class="num small">${num(l.reg,1)} / ${num(l.ot,1)} / ${num(l.dt,1)}</td><td class="num">${money(l.labor)}</td><td class="num">${num(l.miles,1)}</td><td class="num">${money(l.mileAmt)}</td><td class="num"><b>${money(l.total)}</b></td>
     <td class="small">${esc(l.pay_method||'—')}<div class="muted">${esc(l.pay_handle||'')}</div></td><td class="small">${l.payBy?fmtDate(l.payBy):''}</td>
     <td>${l.flags.length?l.flags.map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join(''):'<span class="chip c-g">Ready</span>'}</td></tr>`;
    if(open)h+=l.shifts.concat(l.booked).map(x=>`<tr class="sub"><td style="padding-left:28px">${fmtDate(x.date)} ${x.kind==='booked'?`<span class="chip ${UI.payIncludeBooked?'c-a':'c-r'}">booked, no clock-in${UI.payIncludeBooked?'':' · not paid'}</span>`:x.manual?'<span class="chip c-a">edited</span>':''}</td>

  h+=`</table>${R.lines.length?'':'<div class="empty">No time or mileage in this period.</div>'}</div></div>`;
  const past=(D.payroll||[]);
  if(past.length)h+=`<div class="card noprint"><div class="ch"><h2>Saved payroll runs</h2></div><div class="cb np tw"><table><tr><th>Period</th><th>Status</th><th class="num">People</th><th class="num">Total</th><th>By</th><th></th></tr>${past.map(r=>`<tr><td>${fmtDate(r.period_start)} – ${fmtDate(r.period_end)}</td><td><span class="chip ${stc[r.status]||''}">${esc(r.status)}</span></td><td class="num">${(r.totals||{}).people||0}</td><td class="num">${money((r.totals||{}).total)}</td><td class="small muted">${esc(r.approved_by||r.created_by||'')}</td><td><button class="btn s" onclick="paySetRange('${r.period_start}','${r.period_end}')">Open</button>${r.status==='draft'?` <button class="btn s bad" onclick="payDel('${r.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div></div>`;

let MAPD=null,LMAP=null,MAPVIEW=null,MSEL=null,MDRIVE=null,MLOCATING=false;
const RINGS=[10,25,50];
function geoOf(addr){if(!addr||!MAPD)return null;const g=MAPD.geo[addr.trim()];return g&&g[0]!=null?{lat:+g[0],lng:+g[1]}:null}
function looksLikeAddress(t){return /\d+\s+\S+/.test(t||'')&&/,|\b(va|md|dc|virginia|maryland|co|st|street|ave|rd|road|blvd|dr)\b/i.test(t||'')}
function mapPoints(){

  const venues=[],seen=new Set();
  const add=(v)=>{const k=(v.addr||v.name).toLowerCase().trim();if(!k||seen.has(k))return;seen.add(k);venues.push(v)};
  (MAPD.places||[]).forEach(p=>add({id:'p:'+p.id,name:p.name,kind:p.kind||'venue',addr:p.address||'',geo:p.lat!=null?{lat:+p.lat,lng:+p.lng}:geoOf(p.address),place:p,note:[p.contact,p.phone,p.notes].filter(Boolean).join(' · ')}));
  (MAPD.rentals||[]).forEach((r,i)=>add({id:'r:'+i,name:r.venue||r.client||'Rental delivery',kind:'rental',addr:r.address,geo:geoOf(r.address),note:'Rental · '+(r.client||'')+(r.start_date?' · '+fmtDate(r.start_date):'')}));
  (D.schedules||[]).forEach(sc=>{const v=(sc.data||{}).venue;if(looksLikeAddress(v))add({id:'b:'+sc.id,name:sc.event_name,kind:'booking',addr:v,geo:geoOf(v),note:'Booking'})});

     <div class="small muted" style="padding:6px 12px">DRIVE TO VENUES</div>${!t.geo?'<div class="cb small flag">Locate this address first.</div>':MDRIVE==='loading'?'<div class="cb small muted">Working out drive times…</div>':rows.length?rows.map(r=>`<div class="mrow" onclick="mapSelect('venue','${r.id}')"><span class="dot" style="background:${driveColor(r.min)}"></span><b>${r.min!=null?Math.round(r.min)+' min':'—'}</b> · ${r.mi!=null?num(r.mi,1)+' mi':''}<div class="small muted">${esc(r.name)}</div></div>`).join(''):'<div class="cb small muted">No located venues yet.</div>'}`}
  const v=P.venues.find(x=>x.id===MSEL.id);if(!v)return '';const today=todayYmd();const rows=(MDRIVE&&MDRIVE.rows)||[];
  return `<div class="cb"><b style="font-size:16px">${esc(v.name)}</b> <span class="chip">${esc(v.kind)}</span><div class="small muted">${esc(v.addr||'')}</div>${v.note?`<div class="small">${esc(v.note)}</div>`:''}${v.place?`<div style="margin-top:6px"><button class="btn s" onclick="mapPlaceEdit('${v.place.id}')">Edit</button></div>`:''}</div>
   <div class="small muted" style="padding:6px 12px">CLOSEST TECHS</div>${!v.geo?'<div class="cb small flag">Locate this address first.</div>':MDRIVE==='loading'?'<div class="cb small muted">Working out drive times…</div>':rows.length?rows.map(r=>{const unav=isUnavailable(r.id,today),booked=shiftsOn(r.id,today).length;
     return `<div class="mrow" onclick="mapSelect('tech','${r.id}')"><span class="dot" style="background:${driveColor(r.min)}"></span><b>${r.min!=null?Math.round(r.min)+' min':'—'}</b> · ${r.mi!=null?num(r.mi,1)+' mi':''} · ${esc(r.name)}<div class="small muted">${esc(r.skill||'')}${unav?' <span class="chip c-r">unavailable today</span>':''}${booked?' <span class="chip c-a">booked today</span>':''}</div></div>`}).join(''):'<div class="cb small muted">No located techs yet.</div>'}`}
function driveColor(m){return m==null?'#666':m<=30?'#22C55E':m<=60?'#F5A623':m<=90?'#FB923C':'#E70B0E'}
async function osrmTable(src,dests){
  if(!dests.length)return [];
  const coords=[src].concat(dests).map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  try{const r=await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`);const j=await r.json();
    if(j.code==='Ok')return dests.map((d,i)=>({min:j.durations[0][i+1]!=null?j.durations[0][i+1]/60:null,mi:j.distances&&j.distances[0][i+1]!=null?j.distances[0][i+1]/1609.344:null}));}catch(e){}
  return dests.map(d=>{const mi=haversineMi(src,d)*1.25;return {min:mi/40*60,mi,est:true}})}
async function mapSelect(type,id){
  if(!type){MSEL=null;MDRIVE=null;render();return}
  MSEL={type,id};MDRIVE='loading';render();
  const P=mapPoints();
  if(type==='tech'){const t=P.techs.find(x=>x.id===id);if(!t||!t.geo){MDRIVE=null;render();return}
    const vs=P.venues.filter(v=>v.geo);const res=await osrmTable(t.geo,vs.map(v=>v.geo));
    MDRIVE={rows:vs.map((v,i)=>({id:v.id,name:v.name,...res[i]})).sort((a,b)=>(a.min??1e9)-(b.min??1e9))}}
  else{const v=P.venues.find(x=>x.id===id);if(!v||!v.geo){MDRIVE=null;render();return}
    const ts=P.techs.filter(t=>t.geo);const res=await osrmTable(v.geo,ts.map(t=>t.geo));
    MDRIVE={rows:ts.map((t,i)=>({id:t.id,name:t.name,skill:t.staff.lead_skill||t.staff.title,...res[i]})).sort((a,b)=>(a.min??1e9)-(b.min??1e9))}}
  if(MSEL&&MSEL.id===id&&TAB==='map')render()}
function mapAfterRender(){
  if(!MAPD||typeof L==='undefined'||!$('map'))return;
  if(LMAP){try{MAPVIEW={c:LMAP.getCenter(),z:LMAP.getZoom()};LMAP.remove()}catch(e){}}
  LMAP=L.map('map',{zoomControl:true}).setView(MAPVIEW?MAPVIEW.c:[38.9,-77.03],MAPVIEW?MAPVIEW.z:9);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(LMAP);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(LMAP);
  const P=mapPoints();const dm={};if(MDRIVE&&MDRIVE.rows)MDRIVE.rows.forEach(r=>dm[r.id]=r);
  P.sites.forEach(s=>L.circleMarker([s.geo.lat,s.geo.lng],{radius:4,color:'#22C55E',fillColor:'#22C55E',fillOpacity:.7,weight:1}).addTo(LMAP).bindPopup(`<b>${esc(s.name)}</b><br>Clocked in ${fmtDT(s.date)}${s.ev?'<br>'+esc(s.ev):''}`));
  P.venues.filter(v=>v.geo).forEach(v=>{const d=dm[v.id];const sel=MSEL&&MSEL.id===v.id;
    const m=L.circleMarker([v.geo.lat,v.geo.lng],{radius:sel?10:7,color:'#fff',weight:sel?3:1,fillColor:MSEL&&MSEL.type==='tech'&&d?driveColor(d.min):'#E70B0E',fillOpacity:.95}).addTo(LMAP);
    m.bindTooltip(esc(v.name)+(d&&d.min!=null?' · '+Math.round(d.min)+' min':''));m.on('click',()=>mapSelect('venue',v.id))});
  P.techs.filter(t=>t.geo).forEach(t=>{const d=dm[t.id];const sel=MSEL&&MSEL.id===t.id;
    const m=L.circleMarker([t.geo.lat,t.geo.lng],{radius:sel?9:6,color:'#fff',weight:sel?3:1,fillColor:MSEL&&MSEL.type==='venue'&&d?driveColor(d.min):'#60A5FA',fillOpacity:.95}).addTo(LMAP);
    m.bindTooltip(esc(t.name)+(d&&d.min!=null?' · '+Math.round(d.min)+' min':''));m.on('click',()=>mapSelect('tech',t.id));
    if(sel)RINGS.forEach((mi,i)=>L.circle([t.geo.lat,t.geo.lng],{radius:mi*1609.344,color:['#22C55E','#F5A623','#E70B0E'][i],weight:1.5,fill:false,dashArray:'6 6'}).addTo(LMAP).bindTooltip(mi+' mi',{permanent:false}))});
  setTimeout(()=>LMAP&&LMAP.invalidateSize(),50)}
async function mapLocate(){
  const P=mapPoints();const missing=[...new Set(P.techs.filter(t=>t.addr&&!t.geo).map(t=>t.addr).concat(P.venues.filter(v=>v.addr&&!v.geo).map(v=>v.addr)))];
  MLOCATING=true;render();let ok=0,bad=[];
  for(let i=0;i<missing.length;i++){const a=missing[i];if($('mapProg'))$('mapProg').innerHTML=`<div class="card"><div class="cb small">Locating ${i+1} of ${missing.length}: ${esc(a)}</div></div>`;
    let g=null;try{g=await geocode(a)}catch(e){}
    if(g){MAPD.geo[a.trim()]=[g.lat,g.lng];ok++;try{await sb.rpc('sh_geo_save',{p_address:a.trim(),p_lat:g.lat,p_lng:g.lng})}catch(e){}}else bad.push(a);
    await sleep(1100)}
  MLOCATING=false;MAPVIEW=null;render();toast(`Located ${ok} address(es)`+(bad.length?` · couldn't find ${bad.length} — check spelling in Crew`:''))}
function mapPlaceEdit(id){const p=id?(MAPD.places||[]).find(x=>x.id===id):{kind:'hotel'};
  openModal(`<h3>${id?'Edit':'Add'} venue / hotel</h3>
   <div class="f2"><div><label class="f">Name</label><input class="i" id="pl_name" value="${esc(p.name||'')}"></div><div><label class="f">Type</label><select class="i" id="pl_kind">${['hotel','venue','office','warehouse'].map(k=>`<option ${p.kind===k?'selected':''}>${k}</option>`).join('')}</select></div></div>
   <label class="f">Address</label><input class="i" id="pl_addr" placeholder="1800 Jefferson Davis Hwy, Arlington, VA 22202" value="${esc(p.address||'')}">
   <div class="f2"><div><label class="f">Contact</label><input class="i" id="pl_contact" value="${esc(p.contact||'')}"></div><div><label class="f">Phone</label><input class="i" id="pl_phone" value="${esc(p.phone||'')}"></div></div>
   <label class="f">Notes (loading dock, parking, AV contact…)</label><textarea class="i" id="pl_notes" rows="3">${esc(p.notes||'')}</textarea>
   <div class="small muted" id="pl_msg"></div>
   <div class="acts">${id?`<button class="btn bad" onclick="mapPlaceDel('${id}')">Delete</button><span class="sp"></span>`:''}<button class="btn" onclick="closeLayer()">Cancel</button><button class="btn p" onclick="mapPlaceSave(${id?`'${id}'`:'null'})">Save</button></div>`)}
async function mapPlaceSave(id){const name=$('pl_name').value.trim(),addr=$('pl_addr').value.trim();if(!name||!addr)return toast('Name and address are required');
  $('pl_msg').textContent='Finding the address on the map…';let g=null;try{g=await geocode(addr)}catch(e){}
  if(!g)$('pl_msg').textContent='Could not find that address — saved without a pin. Check the spelling.';
  const r=await rpc('sh_place_save',{p:{id,name,kind:$('pl_kind').value,address:addr,contact:$('pl_contact').value,phone:$('pl_phone').value,notes:$('pl_notes').value,lat:g?g.lat:null,lng:g?g.lng:null}});
  if(g)try{await sb.rpc('sh_geo_save',{p_address:addr,p_lat:g.lat,p_lng:g.lng})}catch(e){}
  closeLayer();toast(g?'Saved and pinned':'Saved (no pin)');MAPVIEW=null;await loadMapData()}
async function mapPlaceDel(id){if(!confirm('Delete this venue/hotel?'))return;await rpc('sh_place_delete',{p_id:id});closeLayer();MSEL=null;MDRIVE=null;await loadMapData()}

/* ================= SETTINGS ================= */
function rSettings(){const M=settings('mileage'),P=settings('payroll');
  let h=`<div class="grid2"><div class="card"><div class="ch"><h2>Mileage</h2></div><div class="cb">
    <label class="f">Rates per mile (by start date)</label><div id="rateRows">${M.rates.map((r,i)=>`<div class="row" style="margin-bottom:6px"><input class="i" type="date" style="width:160px" value="${r.from}" data-k="from" data-i="${i}"><input class="i" type="number" step="0.001" style="width:110px" value="${r.rate}" data-k="rate" data-i="${i}"><button class="btn s g" onclick="this.parentNode.remove()">✕</button></div>`).join('')}</div>
    <button class="btn s" onclick="addRateRow()">+ Add rate</button>
    <p class="help">Default is the IRS business rate: 72.5¢ for Jan 1 – Jun 30, 2026 and 76¢ from Jul 1, 2026 (IRS Announcement 2026-11). Add next year's rate here when the IRS announces it.</p>
    <label class="small"><input type="checkbox" id="st_rt" ${M.roundTrip?'checked':''}> Count round trip (home → site → home)</label><br>
    <label class="small"><input type="checkbox" id="st_reimb" ${M.reimburse?'checked':''}> Add approved mileage to tech pay</label>
    <label class="f">Miles per trip not paid (0 = pay all)</label><input class="i" type="number" id="st_free" style="width:120px" value="${+M.freeMiles||0}">
    <div class="acts"><button class="btn p" onclick="saveMileSettings()">Save mileage settings</button></div></div></div>
   <div class="card"><div class="ch"><h2>Payroll</h2></div><div class="cb">
    <label class="f">Pay period</label><select class="i" id="st_period"><option value="weekly" ${P.period!=='biweekly'?'selected':''}>Weekly</option><option value="biweekly" ${P.period==='biweekly'?'selected':''}>Every 2 weeks</option></select>
    <label class="f">Week starts on</label><select class="i" id="st_ws">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${+P.weekStart===i?'selected':''}>${d}</option>`).join('')}</select>
    <label class="f">Hours rules</label><select class="i" id="st_rc"><option value="v4" ${P.rateCard!=='straight'?'selected':''}>V4 rate card (5-hr min, 10-hr day, OT/DT)</option><option value="straight" ${P.rateCard==='straight'?'selected':''}>Straight hourly (hours × rate)</option></select>
    <label class="f">Days to pay techs after last show day</label><input class="i" type="number" id="st_days" style="width:120px" value="${+P.payoutDays||30}">
    <div class="acts"><button class="btn p" onclick="savePaySettings()">Save payroll settings</button></div></div></div></div>`;
  if(OPEN_MODE)h+=`<div class="card"><div class="cb small"><b>Login is turned off.</b> <span class="muted">Anyone with this page's link can open it. Access controls come back when the login is turned on again.</span></div></div>`;
  if(ME.is_admin){h+=`<div class="card"><div class="ch"><h2>Access — who can open Staffing HQ</h2></div><div class="cb">
    <div class="row"><input class="i" style="max-width:260px" id="ac_email" placeholder="staffing manager email"><input class="i" style="max-width:200px" id="ac_name" placeholder="Name"><button class="btn p" onclick="accSave()">Give access</button></div>
    <p class="help">After you add them, they open this page, type their email and a new password, and click <b>First time? Create password</b>. You (the owner) always have access.</p>
    <table><tr><th>Email</th><th>Name</th><th>Status</th><th></th></tr>${(D.access||[]).map(a=>`<tr><td>${esc(a.email)}</td><td>${esc(a.full_name||'')}</td><td><span class="chip ${a.active?'c-g':'c-r'}">${a.active?'active':'removed'}</span></td><td><button class="btn s" onclick="accToggle('${esc(a.email)}',${!a.active})">${a.active?'Remove':'Restore'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted small">Nobody added yet.</td></tr>'}</table></div></div>`}
  return h}
function addRateRow(){const d=document.createElement('div');d.className='row';d.style.marginBottom='6px';d.innerHTML=`<input class="i" type="date" style="width:160px" data-k="from"><input class="i" type="number" step="0.001" style="width:110px" data-k="rate"><button class="btn s g" onclick="this.parentNode.remove()">✕</button>`;$('rateRows').appendChild(d)}
async function saveMileSettings(){const rates=[...$('rateRows').children].map(r=>({from:r.querySelector('[data-k=from]').value,rate:+r.querySelector('[data-k=rate]').value})).filter(r=>r.from&&r.rate>0);
  if(!rates.length)return toast('Add at least one rate');
  await rpc('sh_setting_save',{p_key:'mileage',p_value:{rates,roundTrip:$('st_rt').checked,reimburse:$('st_reimb').checked,freeMiles:+$('st_free').value||0}});toast('Mileage settings saved');loadData(true)}
async function savePaySettings(){await rpc('sh_setting_save',{p_key:'payroll',p_value:{period:$('st_period').value,weekStart:+$('st_ws').value,rateCard:$('st_rc').value,payoutDays:+$('st_days').value||30}});UI.payStart=null;toast('Payroll settings saved');loadData(true)}
async function accSave(){const e=$('ac_email').value.trim();if(!/@/.test(e))return toast('Enter an email');await rpc('sh_access_save',{p_email:e,p_name:$('ac_name').value.trim()||null,p_active:true});toast('Access given to '+e);loadData(true)}
async function accToggle(e,on){await rpc('sh_access_save',{p_email:e,p_name:null,p_active:on});toast(on?'Restored':'Removed');loadData(true)}

boot();
</script>
